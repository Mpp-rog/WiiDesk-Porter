name: Build Linux AppImage

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab
  schedule:
    - cron: '0 0 * * *' # Automatically runs daily at midnight UTC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full wget fuse jq
          npm install -g @electron/packager

      - name: Fetch Latest Upstream Windows Release
        run: |
          # Uses jq to cleanly parse the download URL without line break/character corruption
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/WiiDesk/WiiDesk-1.0.0/releases/latest | jq -r '.assets[] | select(.name | endswith(".exe")) | .browser_download_url')
          echo "Downloading from: $DOWNLOAD_URL"
          wget -O installer.exe "$DOWNLOAD_URL"

      - name: Extract app.asar
        run: |
          # 1. First pass: extract NSIS installer structure
          7z x installer.exe -oextracted_exe

          # 2. Extract any nested 7z archives found in $PLUGINSDIR (e.g., app-64.7z)
          find extracted_exe -type f -name "*.7z" -exec 7z x {} -oextracted_exe/unpacked_7z \; || true

          # 3. Dynamically search for app.asar across all extracted content
          ASAR_PATH=$(find extracted_exe -type f -name "app.asar" | head -n 1)

          if [ -z "$ASAR_PATH" ]; then
            echo "Error: Could not locate app.asar in extracted archive!"
            echo "Directory layout:"
            find extracted_exe
            exit 1
          fi

          echo "Found app.asar at: $ASAR_PATH"
          mkdir -p src/resources
          cp "$ASAR_PATH" src/resources/app.asar

      - name: Create Minimal package.json for Packager
        run: |
          cat << 'EOF' > src/package.json
          {
            "name": "wiidesk",
            "version": "1.0.0",
            "main": "resources/app.asar"
          }
          EOF

      - name: Build Linux Directory via Electron Packager
        run: |
          npx @electron/packager ./src WiiDesk --platform=linux --arch=x64 --out=dist --overwrite --electron-version=30.0.0

      - name: Download appimagetool
        run: |
          wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        run: |
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run dist/WiiDesk-linux-x64 WiiDesk-x86_64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiiDesk-Linux-AppImage
          path: WiiDesk-x86_64.AppImage
