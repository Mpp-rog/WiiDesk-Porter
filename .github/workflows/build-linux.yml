name: Build Linux AppImage

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full jq wget

      - name: Fetch Latest Upstream Windows Release
        run: |
          # Try fetching latest release first, fallback to all releases if latest is null
          RELEASE_JSON=$(curl -s https://api.github.com/repos/wiidesk/wiidesk/releases/latest)
          
          if echo "$RELEASE_JSON" | grep -q "Not Found"; then
            echo "Latest release not found, querying all releases/tags..."
            RELEASE_JSON=$(curl -s https://api.github.com/repos/wiidesk/wiidesk/releases | jq '.[0]')
          fi

          DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[]? | select(.name | test(".*\\.(exe|zip)$")) | .browser_download_url' | head -n 1)
          
          # Direct fallback if GitHub API assets are empty
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Falling back to direct release asset tag URL..."
            DOWNLOAD_URL="https://github.com/WiiDesk/WiiDesk-1.0.0/releases/download/v1.0.0/WiiDesk-Setup.exe" # Adjust binary name if needed
          fi
          
          echo "Downloading $DOWNLOAD_URL"
          wget -O upstream_release.exe "$DOWNLOAD_URL"
      - name: Extract Upstream Executable
        run: |
          7z x upstream_release.exe -oextracted_exe

      - name: Extract app.asar to Unpacked Directory
        run: |
          ASAR_PATH=$(find extracted_exe -type f -name "app.asar" | head -n 1)
          
          if [ -z "$ASAR_PATH" ]; then
            echo "app.asar not found in extracted release!"
            exit 1
          fi

          npx @electron/asar extract "$ASAR_PATH" unpacked

      - name: Build Linux Directory via Electron Packager
        run: |
          npx @electron/packager ./unpacked WiiDesk --platform=linux --arch=x64 --out=dist --overwrite --electron-version=30.0.0

      - name: Move Unpacked Files into Resources
        run: |
          rm -rf dist/WiiDesk-linux-x64/resources/app*
          mkdir -p dist/WiiDesk-linux-x64/resources/app
          cp -r unpacked/* dist/WiiDesk-linux-x64/resources/app/

      - name: Download appimagetool
        run: |
          wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Setup AppDir Structure
        run: |
          cp wiidesk.png dist/WiiDesk-linux-x64/wiidesk.png

          cat << 'EOF' > dist/WiiDesk-linux-x64/WiiDesk.desktop
          [Desktop Entry]
          Name=WiiDesk
          Exec=WiiDesk --no-sandbox
          Icon=wiidesk
          Type=Application
          Categories=Utility;
          Comment=WiiDesk Desktop Application
          EOF

          cd dist/WiiDesk-linux-x64
          ln -s WiiDesk AppRun

      - name: Build and Chmod AppImage
        run: |
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run dist/WiiDesk-linux-x64 WiiDesk-x86_64.AppImage
          chmod +x WiiDesk-x86_64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiiDesk-Linux-AppImage
          path: WiiDesk-x86_64.AppImage
