name: Build Android APK

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install System & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full jq wget gh

      - name: Get files needed
        run: |
          git clone https://github.com/Mpp-rog/WiiDesk-webapp.git unpacked

      - name: Wrap Web App with Capacitor
        run: |
          cd unpacked
          
          # Create dedicated www directory for Capacitor
          mkdir -p www
          
          # Safely copy non-www files into www/
          for item in *; do
            if [ "$item" != "www" ]; then
              cp -r "$item" www/ 2>/dev/null || true
            fi
          done
          
          # Install Capacitor dependencies
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Initialize Capacitor pointing to the www directory
          npx cap init WiiDesk com.wiidesk.app --web-dir www
          
          # Add Android target and sync files
          npx cap add android
          npx cap sync android

      - name: Fix Kotlin Duplicate Dependencies
        run: |
          cat << 'EOF' >> unpacked/android/build.gradle

          subprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          if (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8') {
                              details.useTarget "org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}"
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build APK via Gradle
        run: |
          cd unpacked/android
          chmod +x gradlew
          ./gradlew assembleDebug
          
          # Copy compiled APK out to project root
          cp app/build/outputs/apk/debug/app-debug.apk ../../WiiDesk-Android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiiDesk-Android-APK
          path: WiiDesk-Android.apk
        
      - name: Create Tag and Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "WiiDesk Releases"
          body: "Automated Android APK build generated from demo website"
          files: WiiDesk-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
