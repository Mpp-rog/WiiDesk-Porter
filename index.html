<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiiDesk Downloads</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #0d0d11;
      color: #e0e0e0;
      margin: 0;
    }
    .container {
      text-align: center;
      padding: 24px;
    }
    .btn {
      display: inline-block;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      background-color: #8a2be2;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 14px rgba(138, 43, 226, 0.4);
    }
    .btn:hover {
      background-color: #7b1fa2;
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn-disabled {
      background-color: #21262d !important;
      color: #6e7681 !important;
      cursor: not-allowed !important;
      box-shadow: none !important;
      border: 1px solid #30363d;
      transform: none !important;
    }
    #status {
      margin-top: 20px;
      font-size: 14px;
      color: #757575;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="download-container"></div>
    <div id="status">Locating latest releases...</div>
  </div>

  <script>
    const OWNER = 'WiiDesk';
    const REPO = 'WiiDesk-1.0.0';

    async function fetchLatestReleases() {
      const statusDiv = document.getElementById('status');
      const containerDiv = document.getElementById('download-container');

      try {
        const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/releases/latest`);
        
        if (!response.ok) {
          statusDiv.innerText = "No published releases found.";
          return;
        }

        const data = await response.json();
        
        // Find assets starting with 'wiidesk' and ending with .appimage or .dmg
        const appimageAsset = data.assets.find(asset => {
          const name = asset.name.toLowerCase();
          return name.startsWith('wiidesk') && name.endsWith('.appimage');
        });

        const dmgAsset = data.assets.find(asset => {
          const name = asset.name.toLowerCase();
          return name.startsWith('wiidesk') && name.endsWith('.dmg');
        });

        let buttonsHtml = '';

        // Linux Button (Purple)
        if (appimageAsset) {
          buttonsHtml += `<a class="btn" href="${appimageAsset.browser_download_url}">wiidesk port for linux</a><br><br>`;
        } else {
          buttonsHtml += `<button class="btn btn-disabled" disabled>wiidesk port for linux (not available)</button><br><br>`;
        }

        // macOS DMG Button (Grayed Out)
        if (dmgAsset) {
          buttonsHtml += `<a class="btn" href="${dmgAsset.browser_download_url}">wiidesk port for mac os</a>`;
        } else {
          buttonsHtml += `<button class="btn btn-disabled" disabled>mac os build isnt here yet</button>`;
        }

        statusDiv.style.display = "none";
        containerDiv.innerHTML = buttonsHtml;

      } catch (err) {
        statusDiv.innerText = "Error fetching release details from GitHub.";
      }
    }

    fetchLatestReleases();
  </script>
</body>
</html>
